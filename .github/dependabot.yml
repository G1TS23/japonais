version: 2
updates:
  # Dépendances npm de l'application web
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Regroupe les mises à jour mineures/patch en une seule PR
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Actions GitHub utilisées par la CI
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
