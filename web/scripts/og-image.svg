      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#f0f0f0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Hinomaru, large, décentré à droite -->
  <circle cx="960" cy="315" r="230" fill="#bc002d" opacity="0.08"/>
  <circle cx="960" cy="315" r="150" fill="#bc002d"/>

  <!-- Contenu texte, aligné à gauche -->
