# Configuration de l'analyse automatique SonarCloud.

# Les fichiers de `data/` sont des banques de contenu : jeux de kana, deck de
# vocabulaire, phases du programme, questions de quiz, points de grammaire.
# Ce sont des dizaines à des centaines d'objets littéraux de forme identique —
# la détection de copier-coller y remonte mécaniquement 50 %+ de duplication
# sans qu'il y ait quoi que ce soit à factoriser. On l'y désactive ; toutes les
# autres règles restent actives sur ces fichiers.
sonar.cpd.exclusions=web/app/data/**
